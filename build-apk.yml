name: Build 7A4 FF Hub APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Arrange Android Project Structure
        run: |
          SRC_DIR="7A4-FF-Hub-All-In-One"
          mkdir -p .github/workflows app/src/main/assets app/src/main/res/drawable app/src/main/cpp app/src/main/java/com/hub7a4/ffmenu
          cp "$SRC_DIR/build-apk.yml" .github/workflows/build-apk.yml
          cp "$SRC_DIR/settings.gradle" settings.gradle
          cp "$SRC_DIR/build.gradle" build.gradle
          cp "$SRC_DIR/app_build.gradle" app/build.gradle
          cp "$SRC_DIR/AndroidManifest.xml" app/src/main/AndroidManifest.xml
          cp "$SRC_DIR/logo.png" app/src/main/assets/logo.png
          cp "$SRC_DIR/drawable_logo.png" app/src/main/res/drawable/logo.png
          for d in mipmap_mdpi mipmap_hdpi mipmap_xhdpi mipmap_xxhdpi mipmap_xxxhdpi; do
            out_d="app/src/main/res/${d/_/-}"
            mkdir -p "$out_d"
            cp "$SRC_DIR/${d}_ic_launcher.png" "$out_d/ic_launcher.png"
          done
          cp "$SRC_DIR/MainActivity.java" app/src/main/java/com/hub7a4/ffmenu/MainActivity.java
          cp "$SRC_DIR/OverlayService.java" app/src/main/java/com/hub7a4/ffmenu/OverlayService.java
          cp "$SRC_DIR/CMakeLists.txt" "$SRC_DIR/main.cpp" "$SRC_DIR/Menu.h" "$SRC_DIR/Menu.cpp" "$SRC_DIR/MemoryEngine.h" "$SRC_DIR/MemoryEngine.cpp" "$SRC_DIR/SDK.h" "$SRC_DIR/TextureLoader.h" app/src/main/cpp/

      - name: Fetch Dear ImGui & stb_image
        run: |
          git clone --depth 1 --branch v1.91.5 https://github.com/ocornut/imgui.git /tmp/imgui
          cp /tmp/imgui/*.cpp /tmp/imgui/*.h app/src/main/cpp/
          cp /tmp/imgui/backends/imgui_impl_android.* app/src/main/cpp/
          cp /tmp/imgui/backends/imgui_impl_opengl3.* app/src/main/cpp/
          curl -sL https://raw.githubusercontent.com/nothings/stb/master/stb_image.h -o app/src/main/cpp/stb_image.h

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

      - name: Generate Gradle Wrapper & Build APKs
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 7A4-FF-Hub-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
