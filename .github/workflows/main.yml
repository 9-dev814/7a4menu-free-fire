
name: 7A4 FF Hub Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Project Source
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "7A4-FF-Hub-All-In-One" ]; then
            SRC="$GITHUB_WORKSPACE/7A4-FF-Hub-All-In-One"

          elif [ -f "7A4-FF-Hub-single-flat-folder.zip" ]; then
            mkdir -p "$RUNNER_TEMP/7a4-source"
            unzip -oq "7A4-FF-Hub-single-flat-folder.zip" \
              -d "$RUNNER_TEMP/7a4-source"

            SRC="$RUNNER_TEMP/7a4-source/7A4-FF-Hub-All-In-One"

          elif [ -f "app_build.gradle" ]; then
            SRC="$GITHUB_WORKSPACE"

          else
            echo "ERROR: Source project not found"
            find . -maxdepth 4 -type f
            exit 1
          fi

          for f in \
            settings.gradle \
            build.gradle \
            app_build.gradle \
            AndroidManifest.xml \
            CMakeLists.txt \
            MainActivity.java \
            OverlayService.java \
            main.cpp \
            Menu.cpp \
            Menu.h \
            MemoryEngine.cpp \
            MemoryEngine.h \
            SDK.h \
            TextureLoader.h; do

            if [ ! -f "$SRC/$f" ]; then
              echo "Missing source file: $f"
              exit 1
            fi
          done

          echo "SOURCE_DIR=$SRC" >> "$GITHUB_ENV"

      - name: Create Android Directory Structure
        shell: bash
        run: |
          set -euo pipefail

          SRC="$SOURCE_DIR"

          mkdir -p app/src/main/java/com/hub7a4/ffmenu
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable

          cp "$SRC/settings.gradle" settings.gradle
          cp "$SRC/build.gradle" build.gradle
          cp "$SRC/app_build.gradle" app/build.gradle

          cp "$SRC/AndroidManifest.xml" \
            app/src/main/AndroidManifest.xml

          cp "$SRC/MainActivity.java" \
            app/src/main/java/com/hub7a4/ffmenu/

          cp "$SRC/OverlayService.java" \
            app/src/main/java/com/hub7a4/ffmenu/

          cp "$SRC/logo.png" app/src/main/assets/logo.png
          cp "$SRC/drawable_logo.png" app/src/main/res/drawable/logo.png

          cp "$SRC/CMakeLists.txt" \
             "$SRC/main.cpp" \
             "$SRC/Menu.cpp" \
             "$SRC/Menu.h" \
             "$SRC/MemoryEngine.cpp" \
             "$SRC/MemoryEngine.h" \
             "$SRC/SDK.h" \
             "$SRC/TextureLoader.h" \
             app/src/main/cpp/

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$d"

            cp "$SRC/mipmap_${d}_ic_launcher.png" \
              "app/src/main/res/mipmap-$d/ic_launcher.png"
          done

      - name: Download ImGui
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            --branch v1.91.5 \
            https://github.com/ocornut/imgui.git \
            "$RUNNER_TEMP/imgui"

          cp "$RUNNER_TEMP"/imgui/*.cpp app/src/main/cpp/
          cp "$RUNNER_TEMP"/imgui/*.h app/src/main/cpp/

          cp "$RUNNER_TEMP"/imgui/backends/imgui_impl_android.* \
            app/src/main/cpp/

          cp "$RUNNER_TEMP"/imgui/backends/imgui_impl_opengl3.* \
            app/src/main/cpp/

          cp "$RUNNER_TEMP"/imgui/backends/imgui_impl_opengl3_loader.h \
            app/src/main/cpp/

      - name: Download stb_image
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            https://raw.githubusercontent.com/nothings/stb/master/stb_image.h \
            -o app/src/main/cpp/stb_image.h

          test -s app/src/main/cpp/stb_image.h

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Check Project Structure
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/cpp/CMakeLists.txt

          echo "Android project structure OK"

      - name: Build APK
        run: |
          gradle assembleDebug assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail

          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk

          ls -lh app/build/outputs/apk/debug/
          ls -lh app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 7A4-FF-Hub-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 7A4-Build-Error-Reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          
