
name: Build 7A4 FF Hub APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate and Extract Project
        shell: bash
        run: |
          set -e

          if [ -d "7A4-FF-Hub-All-In-One" ]; then
            SRC="7A4-FF-Hub-All-In-One"
          elif [ -f "7A4-FF-Hub-single-flat-folder.zip" ]; then
            mkdir -p extracted
            unzip -oq "7A4-FF-Hub-single-flat-folder.zip" -d extracted
            SRC="extracted/7A4-FF-Hub-All-In-One"
          else
            echo "Project folder or ZIP not found!"
            exit 1
          fi

          test -d "$SRC"

          mkdir -p app/src/main/java/com/hub7a4/ffmenu
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable

          cp "$SRC/settings.gradle" settings.gradle
          cp "$SRC/build.gradle" build.gradle
          cp "$SRC/app_build.gradle" app/build.gradle
          cp "$SRC/AndroidManifest.xml" app/src/main/AndroidManifest.xml

          cp "$SRC/MainActivity.java" app/src/main/java/com/hub7a4/ffmenu/
          cp "$SRC/OverlayService.java" app/src/main/java/com/hub7a4/ffmenu/

          cp "$SRC/logo.png" app/src/main/assets/logo.png
          cp "$SRC/drawable_logo.png" app/src/main/res/drawable/logo.png

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$density"
            cp "$SRC/mipmap_${density}_ic_launcher.png" \
              "app/src/main/res/mipmap-$density/ic_launcher.png"
          done

          cp "$SRC"/*.h app/src/main/cpp/
          cp "$SRC"/*.cpp app/src/main/cpp/
          cp "$SRC/CMakeLists.txt" app/src/main/cpp/

          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Download Dear ImGui
        run: |
          set -e

          git clone --depth 1 \
            --branch v1.91.5 \
            https://github.com/ocornut/imgui.git \
            /tmp/imgui

          cp /tmp/imgui/*.cpp app/src/main/cpp/
          cp /tmp/imgui/*.h app/src/main/cpp/

          cp /tmp/imgui/backends/imgui_impl_android.* \
            app/src/main/cpp/

          cp /tmp/imgui/backends/imgui_impl_opengl3.* \
            app/src/main/cpp/

      - name: Download stb_image
        run: |
          curl -fL \
            https://raw.githubusercontent.com/nothings/stb/master/stb_image.h \
            -o app/src/main/cpp/stb_image.h

      - name: Fix Native CMake Sources
        run: |
          cat > app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project(hub7a4)

          add_library(hub7a4 SHARED
              main.cpp
              Menu.cpp
              MemoryEngine.cpp

              imgui.cpp
              imgui_draw.cpp
              imgui_tables.cpp
              imgui_widgets.cpp

              imgui_impl_android.cpp
              imgui_impl_opengl3.cpp
          )

          target_include_directories(hub7a4 PRIVATE
              ${CMAKE_CURRENT_SOURCE_DIR}
          )

          target_compile_features(hub7a4 PRIVATE cxx_std_17)

          target_link_libraries(hub7a4
              android
              log
              EGL
              GLESv3
          )
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 7A4-FF-Hub-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 7A4-FF-Hub-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build Summary
        if: success()
        run: |
          echo "## 7A4 FF Hub Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "- Debug APK: Ready" >> $GITHUB_STEP_SUMMARY
          echo "- Release APK: Ready" >> $GITHUB_STEP_SUMMARY
          echo "- Architecture: arm64-v8a" >> $GITHUB_STEP_SUMMARY
          echo "- Android SDK: 34" >> $GITHUB_STEP_SUMMARY
          echo "- Java: 17" >> $GITHUB_STEP_SUMMARY
          
