          cat << 'EOF' > app/src/main/cpp/main.cpp
#include <jni.h>
#include <GLES3/gl3.h>
#include <android/asset_manager.h>
#include <android/asset_manager_jni.h>
#include <vector>
#define STB_IMAGE_IMPLEMENTATION
#include "stb_image.h"
#include "imgui.h"
#include "imgui_impl_opengl3.h"

static bool g_Init = false, g_Open = true;
static int g_W = 0, g_H = 0, g_Bone = 0;
static float g_Fov = 130.0f, g_Smooth = 3.0f, g_Speed = 1.25f;
static bool g_Aim = false, g_Esp = false, g_FovDraw = true, g_Recoil = false, g_Reload = false, g_SpeedOn = false;
static GLuint g_Tex = 0;
static float g_Aspect = 1.45f;

static GLuint LoadLogo(AAssetManager* mgr) {
    if (!mgr) return 0;
    AAsset* a = AAssetManager_open(mgr, "logo.png", AASSET_MODE_BUFFER);
    if (!a) return 0;
    size_t sz = AAsset_getLength(a);
    std::vector<unsigned char> buf(sz);
    AAsset_read(a, buf.data(), sz);
    AAsset_close(a);
    int w = 0, h = 0, ch = 0;
    unsigned char* px = stbi_load_from_memory(buf.data(), (int)sz, &w, &h, &ch, 4);
    if (!px) return 0;
    if (w > 0 && h > 0) g_Aspect = (float)w / (float)h;
    GLuint id = 0; glGenTextures(1, &id); glBindTexture(GL_TEXTURE_2D, id);
    glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_LINEAR);
    glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_LINEAR);
    glTexImage2D(GL_TEXTURE_2D, 0, GL_RGBA, w, h, 0, GL_RGBA, GL_UNSIGNED_BYTE, px);
    stbi_image_free(px);
    return id;
}

extern "C" {
JNIEXPORT void JNICALL Java_com_hub7a4_ffmenu_OverlayService_nativeInit(JNIEnv* env, jclass, jobject am, jint w, jint h) {
    g_W = w; g_H = h;
    if (!g_Init) {
        IMGUI_CHECKVERSION(); ImGui::CreateContext();
        ImGui::GetIO().IniFilename = nullptr;
        ImGui_ImplOpenGL3_Init("#version 300 es");
        g_Init = true;
    }
    GLuint t = LoadLogo(AAssetManager_fromJava(env, am));
    if (t) g_Tex = t;
}
JNIEXPORT void JNICALL Java_com_hub7a4_ffmenu_OverlayService_nativeRender(JNIEnv*, jclass) {
    if (!g_Init) return;
    ImGuiIO& io = ImGui::GetIO();
    io.DisplaySize = ImVec2((float)g_W, (float)g_H);
    glViewport(0, 0, g_W, g_H); glClearColor(0, 0, 0, 0); glClear(GL_COLOR_BUFFER_BIT);
    ImGui_ImplOpenGL3_NewFrame(); ImGui::NewFrame();
    if (g_FovDraw) ImGui::GetBackgroundDrawList()->AddCircle(ImVec2(g_W * 0.5f, g_H * 0.5f), g_Fov, IM_COL32(185, 60, 255, 240), 64, 2.0f);
    ImGui::SetNextWindowPos(ImVec2(32, 100), ImGuiCond_FirstUseEver);
    ImGui::Begin("##Btn", nullptr, ImGuiWindowFlags_NoTitleBar | ImGuiWindowFlags_AlwaysAutoResize | ImGuiWindowFlags_NoBackground);
    if (g_Tex) { if (ImGui::ImageButton("##Logo", (ImTextureID)(intptr_t)g_Tex, ImVec2(88, 88 / g_Aspect))) g_Open = !g_Open; }
    else if (ImGui::Button("7A4")) g_Open = !g_Open;
    ImGui::End();
    if (g_Open) {
        ImGui::SetNextWindowSize(ImVec2(460, 380), ImGuiCond_FirstUseEver);
        if (ImGui::Begin("7A4 FF HUB", &g_Open)) {
            if (g_Tex) { float bh = 68.0f; ImGui::Image((ImTextureID)(intptr_t)g_Tex, ImVec2(bh * g_Aspect, bh)); }
            if (ImGui::BeginTabBar("Tabs")) {
                if (ImGui::BeginTabItem("Aimbot")) {
                    const char* b[] = { "Dau", "Than", "Tay", "Chan" };
                    ImGui::Checkbox("Bat Aimbot", &g_Aim);
                    ImGui::Combo("Vung", &g_Bone, b, 4);
                    ImGui::SliderFloat("Smooth", &g_Smooth, 1.0f, 15.0f);
                    ImGui::SliderFloat("FOV Aim", &g_Fov, 30.0f, 420.0f);
                    ImGui::EndTabItem();
                }
                if (ImGui::BeginTabItem("ESP + FOV")) {
                    ImGui::Checkbox("Bat ESP", &g_Esp);
                    ImGui::Checkbox("Vong FOV", &g_FovDraw);
                    ImGui::SliderFloat("Size FOV", &g_Fov, 30.0f, 420.0f);
                    ImGui::EndTabItem();
                }
                if (ImGui::BeginTabItem("All Tinh Nang")) {
                    ImGui::Checkbox("No Recoil", &g_Recoil);
                    ImGui::Checkbox("Fast Reload", &g_Reload);
                    ImGui::Checkbox("Speed Hack", &g_SpeedOn);
                    if (g_SpeedOn) ImGui::SliderFloat("Speed", &g_Speed, 1.0f, 2.5f);
                    ImGui::EndTabItem();
                }
                ImGui::EndTabBar();
            }
        }
        ImGui::End();
    }
    ImGui::Render(); ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
}
JNIEXPORT void JNICALL Java_com_hub7a4_ffmenu_OverlayService_nativeTouch(JNIEnv*, jclass, jint act, jfloat x, jfloat y) {
    if (!g_Init) return;
    ImGuiIO& io = ImGui::GetIO(); io.AddMousePosEvent(x, y);
    if (act == 0 || act == 5) io.AddMouseButtonEvent(0, true);
    else if (act == 1 || act == 6) io.AddMouseButtonEvent(0, false);
}
JNIEXPORT jboolean JNICALL Java_com_hub7a4_ffmenu_OverlayService_nativeWantCaptureMouse(JNIEnv*, jclass) {
    return g_Init && ImGui::GetIO().WantCaptureMouse ? JNI_TRUE : JNI_FALSE;
}
}
EOF

