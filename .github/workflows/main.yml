
name: 7A4 FF Hub APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build 7A4 FF Hub
    runs-on: ubuntu-22.04

    steps:
      # 1. Download repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Find and extract original project
      - name: Prepare Android Project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/7a4-source

          ZIP=$(find . -maxdepth 3 -type f \
            -name '7A4-FF-Hub-single-flat-folder.zip' \
            -print -quit)

          if [ -n "$ZIP" ]; then
            unzip -oq "$ZIP" -d /tmp/7a4-source
          fi

          SRC=""

          for ROOT in . /tmp/7a4-source; do
            SRC=$(find "$ROOT" -type f \
              -name app_build.gradle \
              -exec sh -c '
                for f do
                  d=$(dirname "$f")
                  if [ -f "$d/MainActivity.java" ] &&
                     [ -f "$d/OverlayService.java" ] &&
                     [ -f "$d/AndroidManifest.xml" ] &&
                     [ -f "$d/main.cpp" ]; then
                    echo "$d"
                    exit 0
                  fi
                done
              ' sh {} + | head -n 1)

            if [ -n "$SRC" ]; then
              break
            fi
          done

          if [ -z "$SRC" ]; then
            echo "ERROR: Original project not found"
            find . -maxdepth 5 -type f
            exit 1
          fi

          echo "Project: $SRC"

          mkdir -p app/src/main/java/com/hub7a4/ffmenu
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable

          cp "$SRC/settings.gradle" settings.gradle
          cp "$SRC/build.gradle" build.gradle
          cp "$SRC/app_build.gradle" app/build.gradle
          cp "$SRC/AndroidManifest.xml" app/src/main/AndroidManifest.xml

          cp "$SRC/MainActivity.java" \
            app/src/main/java/com/hub7a4/ffmenu/

          cp "$SRC/OverlayService.java" \
            app/src/main/java/com/hub7a4/ffmenu/

          cp "$SRC/logo.png" app/src/main/assets/logo.png
          cp "$SRC/drawable_logo.png" app/src/main/res/drawable/logo.png

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$d"
            cp "$SRC/mipmap_${d}_ic_launcher.png" \
              "app/src/main/res/mipmap-$d/ic_launcher.png"
          done

          cp "$SRC/main.cpp" "$SRC/Menu.cpp" \
             "$SRC/Menu.h" "$SRC/MemoryEngine.cpp" \
             "$SRC/MemoryEngine.h" "$SRC/SDK.h" \
             "$SRC/TextureLoader.h" app/src/main/cpp/

      # 3. Download Dear ImGui
      - name: Install Dear ImGui
        run: |
          set -euo pipefail

          git clone --depth 1 \
            --branch v1.91.5 \
            https://github.com/ocornut/imgui.git \
            /tmp/imgui

          cp /tmp/imgui/imgui.cpp app/src/main/cpp/
          cp /tmp/imgui/imgui_draw.cpp app/src/main/cpp/
          cp /tmp/imgui/imgui_tables.cpp app/src/main/cpp/
          cp /tmp/imgui/imgui_widgets.cpp app/src/main/cpp/

          cp /tmp/imgui/*.h app/src/main/cpp/

          cp /tmp/imgui/backends/imgui_impl_opengl3.cpp \
            app/src/main/cpp/

          cp /tmp/imgui/backends/imgui_impl_opengl3.h \
            app/src/main/cpp/

          cp /tmp/imgui/backends/imgui_impl_opengl3_loader.h \
            app/src/main/cpp/

      # 4. Download stb_image
      - name: Install stb_image
        run: |
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/nothings/stb/master/stb_image.h \
            -o app/src/main/cpp/stb_image.h

      # 5. Fix CMake source list
      - name: Configure Native CMake
        run: |
          cat > app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22.1)

          project(hub7a4)

          add_library(hub7a4 SHARED
              main.cpp
              Menu.cpp
              MemoryEngine.cpp

              imgui.cpp
              imgui_draw.cpp
              imgui_tables.cpp
              imgui_widgets.cpp

              imgui_impl_opengl3.cpp
          )

          target_include_directories(hub7a4 PRIVATE
              ${CMAKE_CURRENT_SOURCE_DIR}
          )

          target_compile_features(hub7a4 PRIVATE cxx_std_17)

          target_link_libraries(hub7a4
              android
              log
              EGL
              GLESv3
          )
          EOF

      # 6. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 7. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      # 8. Setup Gradle
      - name: Setup Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew

      # 9. Validate project
      - name: Validate Gradle
        run: |
          ./gradlew tasks \
            --no-daemon \
            --stacktrace

      # 10. Build Debug
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 11. Upload Debug
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 7A4-FF-Hub-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 12. Build Release
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      # 13. Upload Release
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 7A4-FF-Hub-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 14. Summary
      - name: Build Summary
        if: always()
        run: |
          echo "## 7A4 FF Hub Build" >> $GITHUB_STEP_SUMMARY
          echo "Java: 17" >> $GITHUB_STEP_SUMMARY
          echo "Gradle: 8.2.1" >> $GITHUB_STEP_SUMMARY
          echo "Android SDK: 34" >> $GITHUB_STEP_SUMMARY
          echo "NDK: 26.1.10909125" >> $GITHUB_STEP_SUMMARY
          echo "ABI: arm64-v8a" >> $GITHUB_STEP_SUMMARY
          
