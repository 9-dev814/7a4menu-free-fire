
name: 7A4 FF Hub Builder

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Original ZIP
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p /tmp/7a4

          if [ -f "7A4-FF-Hub-single-flat-folder.zip" ]; then
            unzip -oq "7A4-FF-Hub-single-flat-folder.zip" -d /tmp/7a4
          fi

          SRC=""

          for DIR in \
            "7A4-FF-Hub-All-In-One" \
            "/tmp/7a4/7A4-FF-Hub-All-In-One"; do
            if [ -f "$DIR/app_build.gradle" ]; then
              SRC="$DIR"
              break
            fi
          done

          if [ -z "$SRC" ]; then
            SRC=$(find /tmp/7a4 . \
              -name app_build.gradle \
              -not -path './app/*' \
              -print -quit | xargs -r dirname)
          fi

          test -n "$SRC"
          test -f "$SRC/MainActivity.java"
          test -f "$SRC/main.cpp"

          echo "SOURCE=$SRC" >> "$GITHUB_ENV"

      - name: Create Android Project
        shell: bash
        run: |
          set -euxo pipefail

          SRC="$SOURCE"

          mkdir -p app/src/main/java/com/hub7a4/ffmenu
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable

          cp "$SRC/settings.gradle" settings.gradle
          cp "$SRC/build.gradle" build.gradle
          cp "$SRC/app_build.gradle" app/build.gradle
          cp "$SRC/AndroidManifest.xml" app/src/main/AndroidManifest.xml

          cp "$SRC/MainActivity.java" \
            app/src/main/java/com/hub7a4/ffmenu/

          cp "$SRC/OverlayService.java" \
            app/src/main/java/com/hub7a4/ffmenu/

          cp "$SRC/logo.png" app/src/main/assets/logo.png
          cp "$SRC/drawable_logo.png" app/src/main/res/drawable/logo.png

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$d"
            cp "$SRC/mipmap_${d}_ic_launcher.png" \
              "app/src/main/res/mipmap-$d/ic_launcher.png"
          done

          cp "$SRC/main.cpp" "$SRC/Menu.cpp" \
             "$SRC/Menu.h" "$SRC/MemoryEngine.cpp" \
             "$SRC/MemoryEngine.h" "$SRC/SDK.h" \
             "$SRC/TextureLoader.h" app/src/main/cpp/

      - name: Download Dear ImGui
        run: |
          set -euxo pipefail

          git clone --depth 1 --branch v1.91.5 \
            https://github.com/ocornut/imgui.git /tmp/imgui

          cp /tmp/imgui/imgui.cpp app/src/main/cpp/
          cp /tmp/imgui/imgui_draw.cpp app/src/main/cpp/
          cp /tmp/imgui/imgui_tables.cpp app/src/main/cpp/
          cp /tmp/imgui/imgui_widgets.cpp app/src/main/cpp/

          cp /tmp/imgui/*.h app/src/main/cpp/

          cp /tmp/imgui/backends/imgui_impl_opengl3.cpp \
            app/src/main/cpp/

          cp /tmp/imgui/backends/imgui_impl_opengl3.h \
            app/src/main/cpp/

          cp /tmp/imgui/backends/imgui_impl_opengl3_loader.h \
            app/src/main/cpp/

      - name: Download stb_image
        run: |
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/nothings/stb/master/stb_image.h \
            -o app/src/main/cpp/stb_image.h

      - name: Fix CMake
        run: |
          cat > app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project(hub7a4)

          add_library(hub7a4 SHARED
              main.cpp
              Menu.cpp
              MemoryEngine.cpp
              imgui.cpp
              imgui_draw.cpp
              imgui_tables.cpp
              imgui_widgets.cpp
              imgui_impl_opengl3.cpp
          )

          target_include_directories(hub7a4 PRIVATE
              ${CMAKE_CURRENT_SOURCE_DIR}
          )

          target_compile_features(hub7a4 PRIVATE cxx_std_17)

          target_link_libraries(hub7a4
              android
              log
              EGL
              GLESv3
          )
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 7A4-FF-Hub-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          
