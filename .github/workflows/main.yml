name: Build 7A4 FF Hub APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  read-yaml:
    runs-on: ubuntu-latest
    name: Example job
    steps:
      - name: Checkout # checkout your sources file
        uses: actions/checkout@v4

      - name: Write yaml # use the action to read yaml
        id: yaml-action
        uses: teunmooij/yaml@v1
        with:
          data: >-
            {
              "foo": "bar"
            }
          to-file: 'helm/values.yml'

      - name: Setup Java & Android SDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

      - name: Build APK
        run: |
          set -e
          SRC_DIR="."
          [ -d "7A4-FF-Hub" ] && SRC_DIR="7A4-FF-Hub"
          [ -d "7A4-FF-Hub-All-In-One" ] && SRC_DIR="7A4-FF-Hub-All-In-One"
          LOGO=$(find "$SRC_DIR" -maxdepth 2 \( -name "logo.png" -o -name "7864.png" \) | head -n 1)
          [ -z "$LOGO" ] && { echo "Missing logo"; exit 1; }

          mkdir -p app/src/main/assets app/src/main/res/drawable app/src/main/cpp app/src/main/java/com/hub7a4/ffmenu
          cp -f "$LOGO" app/src/main/assets/logo.png app/src/main/res/drawable/logo.png
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null
          for s in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            d="app/src/main/res/${s%%:*}"; sz="${s##*:}"; mkdir -p "$d"
            convert "$LOGO" -background none -gravity center -resize "${sz}x${sz}" -extent "${sz}x${sz}" "$d/ic_launcher.png"
          done

          cat << 'EOF' > settings.gradle
pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name = "7A4-FF-Hub"
include ':app'
EOF

          cat << 'EOF' > build.gradle
plugins { id 'com.android.application' version '8.2.2' apply false }
EOF

          cat << 'EOF' > app/build.gradle
plugins { id 'com.android.application' }
android {
    namespace 'com.hub7a4.ffmenu'
    compileSdk 34
    ndkVersion '26.1.10909125'
    defaultConfig {
        applicationId "com.hub7a4.ffmenu"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags "-std=c++17 -O3"; arguments "-DANDROID_STL=c++_static" } }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } debug { jniDebuggable true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }
}
dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
    <application android:allowBackup="false" android:icon="@mipmap/ic_launcher" android:label="7A4 FF Hub" android:theme="@style/Theme.AppCompat.NoActionBar">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
        </activity>
        <service android:name=".OverlayService" android:enabled="true" android:exported="false" android:foregroundServiceType="specialUse" />
    </application>
</manifest>
EOF

          cat << 'EOF' > app/src/main/java/com/hub7a4/ffmenu/MainActivity.java
package com.hub7a4.ffmenu;
import android.app.Activity;
import android.content.Intent;
import android.net.Uri;
import android.os.Bundle;
import android.provider.Settings;
public class MainActivity extends Activity {
    @Override protected void onCreate(Bundle b) {
        super.onCreate(b);
        try { Runtime.getRuntime().exec(new String[]{"su", "-c", "id"}); } catch (Exception ignored) {}
        if (!Settings.canDrawOverlays(this)) {
            startActivityForResult(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())), 1001);
        } else { startSvc(); }
    }
    @Override protected void onActivityResult(int r, int c, Intent d) {
        if (r == 1001 && Settings.canDrawOverlays(this)) startSvc(); else finish();
    }
    private void startSvc() { startForegroundService(new Intent(this, OverlayService.class)); finish(); }
}
EOF

          cat << 'EOF' > app/src/main/java/com/hub7a4/ffmenu/OverlayService.java
package com.hub7a4.ffmenu;
import android.app.*;
import android.content.Intent;
import android.content.res.AssetManager;
import android.graphics.PixelFormat;
import android.opengl.GLSurfaceView;
import android.os.IBinder;
import android.provider.Settings;
import android.view.*;
import javax.microedition.khronos.egl.EGLConfig;
import javax.microedition.khronos.opengles.GL10;
public class OverlayService extends Service {
    static { System.loadLibrary("hub7a4"); }
    private WindowManager wm;
    private GLSurfaceView glView;
    public static native void nativeInit(AssetManager mgr, int w, int h);
    public static native void nativeRender();
    public static native void nativeTouch(int act, float x, float y);
    public static native boolean nativeWantCaptureMouse();
    @Override public void onCreate() {
        super.onCreate();
        if (!Settings.canDrawOverlays(this)) { stopSelf(); return; }
        String chId = "hub7a4";
        getSystemService(NotificationManager.class).createNotificationChannel(new NotificationChannel(chId, "7A4", NotificationManager.IMPORTANCE_LOW));
        startForeground(1, new Notification.Builder(this, chId).setContentTitle("7A4 Hub").setSmallIcon(android.R.drawable.ic_dialog_info).build());
        wm = (WindowManager) getSystemService(WINDOW_SERVICE);
        WindowManager.LayoutParams p = new WindowManager.LayoutParams(-1, -1, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN, PixelFormat.TRANSLUCENT);
        p.gravity = Gravity.TOP | Gravity.START;
        glView = new GLSurfaceView(this);
        glView.setEGLContextClientVersion(3);
        glView.setEGLConfigChooser(8, 8, 8, 8, 16, 0);
        glView.getHolder().setFormat(PixelFormat.TRANSLUCENT);
        glView.setZOrderOnTop(true);
        glView.setRenderer(new GLSurfaceView.Renderer() {
            public void onSurfaceCreated(GL10 g, EGLConfig c) { nativeInit(getAssets(), glView.getWidth(), glView.getHeight()); }
            public void onSurfaceChanged(GL10 g, int w, int h) { nativeInit(getAssets(), w, h); }
            public void onDrawFrame(GL10 g) { nativeRender(); }
        });
        glView.setOnTouchListener((v, e) -> { nativeTouch(e.getActionMasked(), e.getX(), e.getY()); return nativeWantCaptureMouse(); });
        wm.addView(glView, p);
    }
    @Override public void onDestroy() { if (wm != null && glView != null) wm.removeView(glView); super.onDestroy(); }
    @Override public IBinder onBind(Intent i) { return null; }
}
EOF

          git clone --depth 1 --branch v1.91.5 https://github.com/ocornut/imgui.git /tmp/imgui
          cp -f /tmp/imgui/*.cpp /tmp/imgui/*.h /tmp/imgui/backends/imgui_impl_android.* /tmp/imgui/backends/imgui_impl_opengl3.* app/src/main/cpp/
          curl -fsSL https://raw.githubusercontent.com/nothings/stb/master/stb_image.h -o app/src/main/cpp/stb_image.h

          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
